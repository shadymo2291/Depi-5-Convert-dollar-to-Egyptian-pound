<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert dollar to Egyptian pound</title>
    <!-- bootstrap6 css file -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    
    <div class="container">
        <div class="row">
            <h1 class="mt-12 mb-8 text-center">Convert dollar to Egyptian pound</h1>
        
            <form action="index.html" id="my_form">
                <input type="text" id="data" placeholder="Enter The Number" class="form-control">
                <button type="submit" id="my_btn" class="btn-solid theme-accent d-flex w-100 my-4">Convert</button>
            </form> 

            <h5 id="result"></h5>
        </div>
    </div>
    
    <!-- bootstrap js file -->
    <script src="js/bootstrap.bundle.min.js"></script>
    
    <!-- main js file -->
     <script src="js/main.js"></script>
</body>
</html>
